[package]
name = "spacers"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An example printCAD workbench package: spacers and standoffs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
printcad-bench-sdk = { git = "https://github.com/gilbertorconde/printCAD", tag = "v0.6.0" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
